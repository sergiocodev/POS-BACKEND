# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/siocdev}
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# Hibernate: Dejamos que Hibernate controle las tablas (Flyway fue eliminado)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false



# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION}

# ==========================================
# APPLICATION DEFAULTS
# ==========================================
app.default.role=USER
app.timezone=America/Lima


# ==========================================
# EXTERNAL APIS (apis.net.pe)
# ==========================================

apisnet.api.token=${APISNET_TOKEN}
apisnet.api.url.dni=https://api.apis.net.pe/v2/reniec/dni
apisnet.api.url.ruc=https://api.apis.net.pe/v2/sunat/ruc

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html 

# ==========================================
# JACKSON CONFIGURATION
# ==========================================
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ==========================================
# CORS CONFIGURATION
# ==========================================
# Configurar dominios específicos en producción para evitar vulnerabilidades CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}