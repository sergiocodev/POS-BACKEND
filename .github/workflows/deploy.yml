name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e # Detiene la ejecución inmediatamente si un comando falla
            
            # 1. Navegar a la carpeta
            cd ~/POS-BACKEND
            
            # 2. Traer cambios
            git pull origin master
            
            # 3. Compilar el código usando un contenedor Docker efímero con Java 21
            chmod +x mvnw
            docker run --rm -v "$PWD":/app -v "$HOME/.m2":/root/.m2 -w /app eclipse-temurin:21-jdk ./mvnw clean package -DskipTests
            
            # 4. Reconstruir imagen y contenedor
            docker compose up -d --build --force-recreate backend
            
            # 5. Limpiar imágenes huérfanas
            docker image prune -f